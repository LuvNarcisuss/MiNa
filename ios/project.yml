name: MiNa
options:
  schemePathPrefix: "../../"
  deploymentTarget:
    iOS: '16.0'
fileGroups:
  - Configuration
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    PRODUCT_BUNDLE_IDENTIFIER: com.mina.bedtime
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  TPInAppReceipt:
    url: https://github.com/tikhop/TPInAppReceipt.git
    exactVersion: 4.0.2
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 137.0.0
targets:
  MiNa:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
    dependencies:
      - package: TPInAppReceipt
      - package: WebRTC
    sources:
      - path: MiNa
        excludes: [Info.plist, Artwork, policies.json]
    settings:
      base:
        INFOPLIST_FILE: MiNa/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
schemes:
  MiNa:
    build:
      targets:
        MiNa: all
    run:
      config: Debug
      storeKitConfiguration: Configuration/MiNaCoins.storekit
    archive:
      config: Release
